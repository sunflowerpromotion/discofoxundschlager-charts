name: Discofox & Schlager Charts aktualisieren

on:

  # Automatisch alle 5 Minuten
  schedule:
    - cron: "*/5 * * * *"

  # Ermöglicht einen manuellen Start
  workflow_dispatch:


# GitHub Action darf Dateien im Repository ändern
permissions:
  contents: write


jobs:

  update-charts:

    runs-on: ubuntu-latest

    steps:

      # Repository herunterladen
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # Python installieren
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # Python-Skript ausführen
      - name: laut.fm Charts aktualisieren
        run: |
          python update_charts.py


      # Prüfen, ob sich Daten geändert haben
      - name: Änderungen prüfen
        id: changes
        run: |

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      # Neue Daten ins Repository schreiben
      - name: Charts speichern
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git commit \
            -m "Charts automatisch aktualisiert"

          git push
